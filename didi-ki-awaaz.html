    openAgentModal(r);
  }));
}
// Factual comparison with the team for the same period - this is feedback about a real person, so it states numbers, not judgements.
function agentInsight(r, team){
  const cmp = (v, t, higherBetter) => v===null||t===null ? '' : (Math.round(v)===Math.round(t) ? 'in line with' : ((v>t)===higherBetter ? 'better than' : 'below'));
  return `<div class="note-inline">She answers <b>${fmtPct(r.pickup,0)}</b> of the calls that ring her &mdash; ${cmp(r.pickup, team.pickup, true)} the team's ${fmtPct(team.pickup,0)}. Her median pickup time is <b>${fmtSecs(r.ringMed)}</b> (team: ${fmtSecs(team.ringMed)}).</div>`;
}
function teamStats(calls){
  const rungTotal = agentStats(calls).reduce((a,r)=>a+r.rung,0);
  const ansTotal = calls.filter(c=>c.a && c.ag).length;
  return { pickup: pct(ansTotal, rungTotal), ringMed: median(calls.filter(c=>c.a && c.ring!==null).map(c=>c.ring)) };
}
function openAgentModal(r){
  let html = `<div class="mini-tiles">
    ${miniTile('Team Rank', r.rank ? `${r.rank}${ord(r.rank)}` : '—', 'Rank by pickup rate among all agents for the selected period.')}
    ${miniTile('Calls Rung', fmtNum(r.rung), 'Calls on which her phone rang.')}
    ${miniTile('Answered', fmtNum(r.ans))}
    ${miniTile('Pickup Rate', fmtPct(r.pickup,0))}
    ${miniTile('Pickup Speed', fmtSecs(r.ringMed))}
    ${miniTile('Avg Talk Time', fmtSecs(r.talkAvg))}
    ${miniTile('Share of Answered', fmtPct(r.share,0))}
    ${miniTile('Active Days', fmtNum(r.days))}
    ${miniTile('Resolved on the Call', r.resKnown ? `${fmtPct(r.resolved,0)} (${r.resYes}/${r.resKnown})` : '—', 'Of her answered calls where the outcome was clear, the share fully resolved during the call (partly resolved: '+(r.resPart||0)+'). Not scored - it depends on what callers ask.')}
  </div>`;
  html += agentInsight(r, teamStats(callsInPeriod()));
  if(r.fewCalls) html += `<div class="note-inline">Her rate is based on only ${fmtNum(r.rung)} call${r.rung===1?'':'s'} in this period, so treat it with caution.</div>`;
  const rowsM = months().map(m=>{ const s = agentStats(DATA.calls.filter(c=>c.d.slice(0,7)===m)).find(x=>x.name===r.name); return {m, s}; }).filter(x=>x.s && x.s.rung);
  html += `<div class="modal-subhead">Month by month</div><table class="rank3-table"><thead><tr><th>Month</th><th class="num">Rung</th><th class="num">Answered</th><th class="num">Pickup</th><th class="num">Talk (min)</th></tr></thead><tbody>
    ${rowsM.map(({m,s})=>`<tr><td>${monthLong(m)}</td><td class="num">${s.rung}</td><td class="num">${s.ans}</td><td class="num" style="color:${grade(s.pickup)};font-weight:700">${fmtPct(s.pickup,0)}</td><td class="num">${fmtF(s.talkHrs*60,0)}</td></tr>`).join('')}
  </tbody></table>`;
  openModal(r.name, html);
}

// ---------------------------------------------------------------- Missed Calls
function renderMissed(){
  const calls = callsInPeriod(), miss = calls.filter(c=>!c.a), h = headline(calls);
  const count = k => miss.filter(c=>c.why===k).length;
  const triedSegs = [['None — lost before any agent rang', 0, '#C55F49'], ['1 agent', 1, '#CE9C3C'], ['2 agents', 2, '#2A5C8C'], ['3 or more', 3, '#7C8B81']]
    .map(([label, n, color])=>({label, color, value: miss.filter(c=> n<3 ? c.rung.length===n : c.rung.length>=3).length}));
  const holdBins = [[0,5],[5,10],[10,20],[20,30],[30,60],[60,Infinity]];
  const binLabel = ([lo,hi]) => hi===Infinity ? `${lo}s+` : `${lo}–${hi}s`;
  const el = document.getElementById('panel-missed');
  // calls dropped before any phone rang: Sunday-holiday / outside 9:30-17:30 / other calls in progress / agents free
  const HOLIDAYS = ['2026-08-15','2026-10-02'];
  const early = miss.filter(c=>c.why==='before_ring');
  const earlyKind = c => (c.wd===6 || HOLIDAYS.includes(c.d)) ? 'off' : (c.mi < 570 || c.mi >= 1050) ? 'after' : c.busy > 0 ? 'busy' : 'free';
  const earlyN = k => early.filter(c=>earlyKind(c)===k).length;
  const perDayN = {}; calls.forEach(c=>{ perDayN[c.d] = (perDayN[c.d]||0) + 1; });
  const sp = calls.filter(c=>perDayN[c.d]>=20), ot = calls.filter(c=>perDayN[c.d]<20);
  const spikeRate = sp.length ? pct(sp.filter(c=>c.a).length, sp.length) : null, otherRate = pct(ot.filter(c=>c.a).length, ot.length);
  el.innerHTML = `
    <section><div class="section-head"><h2 class="serif">Why Calls Are Missed</h2><span class="hint">${fmtNum(miss.length)} missed calls &middot; ${periodLabel()}</span></div>
      <div class="panel">
        <div class="tiles" style="margin-bottom:16px;">
          ${Object.entries(MISS_REASONS).map(([k,v])=>tile(v.label, fmtNum(count(k)), `${fmtPct(pct(count(k),miss.length),0)} of missed`, k==='line_unavailable'?'neutral':(k==='before_ring'?'neg':'warn'))).join('')}
        </div>
        ${stackedBarChart(Object.entries(MISS_REASONS).map(([k,v])=>({label:v.label, value:count(k), color:v.color})))}
        <p class="note-inline"><b>Rang out</b>: every agent's phone rang and nobody picked up &mdash; the biggest reason calls are lost.</p>
      </div></section>
    <section><div class="section-head"><h2 class="serif">Calls Lost Before Any Phone Rang &mdash; When?</h2><span class="hint">${fmtNum(early.length)} calls &middot; ${periodLabel()}</span></div>
      <div class="panel">
        <div id="chart-early"></div>
        <p class="note-inline">Most were lost <b>during working hours with no other call going on</b>, after about ${fmtSecs(median(early.map(c=>c.dur)))} on the line &mdash; so not because agents were busy. Worth checking the call-routing set-up (welcome message, queue, agents logged in). Busy days are not the problem either: on days with 20+ calls, ${fmtPct(spikeRate,0)} were answered vs ${fmtPct(otherRate,0)} on other days.</p>
      </div></section>
    <section><div class="section-head"><h2 class="serif">Agents Tried Before the Call Was Lost</h2><span class="hint">share of the ${fmtNum(miss.length)} missed calls</span></div>
      <div class="panel">${donutHtml('svg-agents-tried', triedSegs)}</div></section>
    <section><div class="section-head"><h2 class="serif">How Long Callers Held</h2><span class="hint">seconds before the missed call ended &middot; grouped by month</span></div>
      <div class="panel"><div id="chart-hold"></div></div></section>
    <section><div class="section-head"><h2 class="serif">Did Callers Get Through Later?</h2><span class="hint">callers who had at least one missed call</span></div>
      <div class="panel">
        <div class="tiles">
          ${tile('Callers With a Missed Call', fmtNum(h.withMiss), null, 'neutral')}
          ${tile('Got Through on Another Call', fmtNum(h.recovered), fmtPct(pct(h.recovered,h.withMiss),0), '')}
          ${tile('Never Got Through', fmtNum(h.withMiss-h.recovered), fmtPct(pct(h.withMiss-h.recovered,h.withMiss),0), 'neg')}
        </div>
        <p class="note-inline">Counts incoming calls only &mdash; callbacks made by the helpline aren't in this data yet.</p>
      </div></section>`;

  drawDonutSegs('svg-agents-tried', triedSegs);
  const earlyRows = [['free','In working hours, no other call going on'], ['busy','In working hours, a didi on another call (incoming or outgoing)'],
                     ['after','Outside 9:30 am – 5:30 pm'], ['off','Sunday or holiday']].map(([k,l])=>[l, earlyN(k)]).filter(e=>e[1]);
  hbar('chart-early', earlyRows, {base: early.length, color:C_MISS});

  // Grouped vertical bars: x = hold-time band, one bar per month in the selected period
  const MONTH_COLORS = ['#2F9C74','#CE9C3C','#2A5C8C','#C55F49','#8A6A1F','#5B8AA6','#7C8B81','#B7BEB7','#1F6B4D','#E0B96A','#6E97BF','#D98A77'];
  const periodMonths = [...new Set(miss.map(c=>c.d.slice(0,7)))].sort();
  const x = holdBins.map(binLabel);
  const traces = periodMonths.map((m,i)=>{
    const mm = miss.filter(c=>c.d.startsWith(m));
    const counts = holdBins.map(([lo,hi])=>mm.filter(c=>c.dur>=lo && c.dur<hi).length);
    return {x, y: counts, name: monthLabel(m), type:'bar', marker:{color: MONTH_COLORS[i % MONTH_COLORS.length]},
      customdata: counts.map(n=>fmtPct(pct(n, mm.length),0)),
      hovertemplate:`${monthLong(m)}<br>held %{x}: %{y} calls (%{customdata} of that month's missed)<extra></extra>`};
  });
  plot('chart-hold', traces, {...plotlyBarLayout('Missed calls'), barmode:'group',
    xaxis:{type:'category', automargin:true, title:{text:'How long the caller held'}}});
}

// ---------------------------------------------------------------- Who & Where
// Caller type + DAK come from matching the caller's phone number against DAK records (done in
// build_didi_ki_awaaz_data.py; only the result is in the data). District comes from that DAK, or
// from a person's listening code when the caller said where she is from.
const CT_ORDER = ['C','S','A','U'];
const CT_COLOR = {C:'#2563A6', U:'#2F9C74', A:'#CE9C3C', S:'#7C8B81'};
let GEO = null;
async function loadGeo(){
  if(GEO) return GEO;
  if(window.EMBEDDED_GEO){ GEO = window.EMBEDDED_GEO; return GEO; }
  try{ const r = await fetch('data/geo/districts_38.geojson'); if(r.ok) GEO = await r.json(); }catch(e){}
  return GEO;
}
const normDist = s => s ? String(s).toUpperCase().replace(/\s+/g,' ').trim() : null;
function callDistrict(c){
  const lc = c.lc;
  if(lc && lc.dist && !/not said|outside/i.test(lc.dist)) return {d: normDist(lc.dist), src:'listening'};
  if(c.dk !== null && c.dk !== undefined) return {d: normDist(DATA.daks[c.dk].district), src:'phone'};
  return null;
}
let DAK_DISTRICT = '';
async function renderWhoWhere(){
  const calls = callsInPeriod();
  const el = document.getElementById('panel-where');
  const typeStats = CT_ORDER.map(k=>{
    const cs = calls.filter(c=>c.ct===k);
    return {k, label: DATA.caller_types[k], calls: cs.length, ans: cs.filter(c=>c.a).length, callers: new Set(cs.map(c=>c.c)).size};
  });
  const located = calls.map(c=>({c, loc: callDistrict(c)})).filter(x=>x.loc);
  const callsByDak = {};
  calls.filter(c=>c.dk!==null && c.dk!==undefined).forEach(c=>{
    const s = callsByDak[c.dk] = callsByDak[c.dk] || {calls:0, ans:0, coord:0}; s.calls++; if(c.a) s.ans++; if(c.ct==='C') s.coord++; });
  const withNo = DATA.daks.map((d,i)=>({...d, i, hc: callsByDak[i] || {calls:0, ans:0, coord:0}})).filter(d=>d.has_coord_no);
  const called = withNo.filter(d=>d.hc.calls>0);

  el.innerHTML = `
    <section><div class="section-head"><h2 class="serif">Who Is Calling</h2><span class="hint">${periodLabel()} &middot; ${fmtNum(calls.length)} calls</span></div>
      <div class="panel">
        <div class="donut-grid"><div id="chart-caller-types"></div>
          <div class="topic-key">${typeStats.filter(t=>t.calls).map(t=>`<div class="topic-key-row"><span class="legend-swatch" style="background:${CT_COLOR[t.k]}"></span><div><b>${t.label}</b> &middot; ${fmtNum(t.calls)} calls<div class="topic-key-desc">${fmtNum(t.callers)} phone${t.callers===1?'':'s'} &middot; ${fmtPct(pct(t.ans,t.calls),0)} of their calls answered</div></div></div>`).join('')}</div>
        </div>
        <p class="note-inline">Found by matching each caller's phone number with the numbers in DAK records. Most callers <b>not in DAK records</b> turn out to be JEEViKA staff on other phones, not women from the community.</p>
      </div></section>
    <section><div class="section-head"><h2 class="serif">Where Calls Come From</h2><span class="hint">${fmtNum(located.length)} of ${fmtNum(calls.length)} calls could be placed (${fmtPct(pct(located.length, calls.length),0)})</span></div>
      <div class="panel"><div id="map-where"></div>
        <details class="more-table"><summary>Show calls by district (table)</summary><div id="table-where-district"></div></details></div></section>
    <section><div class="section-head"><h2 class="serif">DAKs That Call the Helpline</h2><span class="hint">${periodLabel()} &middot; ${fmtNum(called.length)} DAKs with calls</span></div>
      <div class="panel">
        <div class="md-grid">
          <div><div class="chart-head" style="margin-top:0">Districts <span class="soft">&middot; click one</span></div><div id="chart-districts"></div></div>
          <div><div class="chart-head" style="margin-top:0" id="dak-detail-title"></div><div id="chart-daks"></div></div>
        </div>
        <details class="more-table"><summary>Show all ${fmtNum(called.length)} DAKs as a table</summary><div id="table-dak-callers"></div></details>
      </div></section>`;

  // caller types: donut
  const tsd = typeStats.filter(t=>t.calls);
  plot('chart-caller-types', [donutTrace(tsd.map(t=>t.label), tsd.map(t=>t.calls), tsd.map(t=>CT_COLOR[t.k]),
    tsd.map(t=>`<b>${t.label}</b><br>${t.calls} calls · ${fmtPct(pct(t.ans,t.calls),0)} answered`))],
    {...donutLayout(calls.length, 'calls'), showlegend:false});

  // Districts (all 38, including ones with no calls) on the left; the chosen district's DAKs on the right
  // (before a click: the 12 DAKs with most calls across Bihar). One colour; calls + answer rate at the bar end.
  const byDist = {};
  DATA.daks.forEach(d=>{ byDist[toTitle(d.district)] = byDist[toTitle(d.district)] || []; });
  called.forEach(d=>{ byDist[toTitle(d.district)].push(d); });
  const distRows = Object.entries(byDist).map(([k, ds])=>({k, calls: ds.reduce((a,d)=>a+d.hc.calls,0), ans: ds.reduce((a,d)=>a+d.hc.ans,0), n: ds.length}))
    .sort((a,b)=>b.calls-a.calls || a.k.localeCompare(b.k));
  const barChart = (id, rows, label, hover, opts) => {
    const rr = rows.slice().reverse();
    const l = hbarLayout(rr.length);
    plot(id, [{y: rr.map(r=>fitLabel(label(r))), x: rr.map(r=>r.calls), type:'bar', orientation:'h',
      marker:{color: rr.map(r=>opts && opts.hi && opts.hi(r) ? C_GOLD : ((opts && opts.color) || C_ANS))},
      text: rr.map(r=>r.calls ? `  ${r.calls} · ${fmtPct(pct(r.ans, r.calls),0)} ans.` : '  no calls'), textposition:'outside', cliponaxis:false,
      textfont:{size:11.5, color:INK}, hovertext: rr.map(hover), hovertemplate:'%{hovertext}<extra></extra>'}],
      {...l, height: 20 + 24*rr.length, bargap:0.3, margin:{...l.margin, r: 110},
       yaxis:{...l.yaxis, type:'category', tickfont:{size:11.5, color:INK}}});
  };
  const drawDaks = () => {
    const title = document.getElementById('dak-detail-title');
    let rows, label;
    if(!DAK_DISTRICT){
      rows = called.map(d=>({...d, calls:d.hc.calls, ans:d.hc.ans})).sort((a,b)=>b.calls-a.calls || b.ans-a.ans).slice(0,12);
      title.innerHTML = `DAKs with the most calls <span class="soft">&middot; all districts</span>`;
      label = d=>`${toTitle(d.block)}, ${toTitle(d.district)}`;
    } else {
      rows = byDist[DAK_DISTRICT].map(d=>({...d, calls:d.hc.calls, ans:d.hc.ans})).sort((a,b)=>b.calls-a.calls);
      title.innerHTML = `${esc(DAK_DISTRICT)} <span class="soft">&middot; ${rows.length} DAK${rows.length===1?'':'s'} with calls &middot; <a href="#" id="dak-reset">show all districts</a></span>`;
      label = d=>toTitle(d.block);
    }
    if(!rows.length){ document.getElementById('chart-daks').innerHTML = '<p class="disclaimer">No DAK in this district has called the helpline yet.</p>'; }
    else barChart('chart-daks', rows, label, d=>`<b>${toTitle(d.name)}</b><br>${toTitle(d.block)}, ${toTitle(d.district)}<br>${d.calls} calls · ${d.ans} answered`, {color:'#2563A6'});
    const reset = document.getElementById('dak-reset');
    if(reset) reset.addEventListener('click', e=>{ e.preventDefault(); DAK_DISTRICT = ''; drawAll(); });
  };
  const drawAll = () => {
    barChart('chart-districts', distRows, r=>r.k, r=>`<b>${r.k}</b><br>${r.calls} calls from ${r.n} DAK${r.n===1?'':'s'} · ${r.ans} answered<br>click to see its DAKs`,
      {hi: r=>r.k===DAK_DISTRICT});
    document.getElementById('chart-districts').on('plotly_click', ev=>{ DAK_DISTRICT = distRows.slice().reverse()[ev.points[0].pointIndex].k; drawAll(); });
    drawDaks();
  };
  drawAll();

  makeSortableTable('table-dak-callers', [
    {label:'DAK', key:'name'}, {label:'District', key:'district'}, {label:'Block', key:'block'},
    {label:'Calls', key:'calls', num:true}, {label:'Answered', key:'ans', num:true},
  ], called.map(d=>({...d, calls:d.hc.calls, ans:d.hc.ans})).sort((a,b)=>b.calls-a.calls),
  r=>[esc(toTitle(r.name)), esc(toTitle(r.district)), esc(toTitle(r.block)), fmtNum(r.calls), fmtNum(r.ans)]);

  // district table + map
  const dist = {};
  located.forEach(({c, loc})=>{ const s = dist[loc.d] = dist[loc.d] || {d:loc.d, calls:0, ans:0, coord:0, other:0}; s.calls++; if(c.a) s.ans++; c.ct==='C' ? s.coord++ : s.other++; });
  const dakByDist = {};
  DATA.daks.forEach(d=>{ const k = normDist(d.district); const s = dakByDist[k] = dakByDist[k] || {daks:0}; s.daks++; });
  const drows = Object.keys(dakByDist).sort().map(k=>({d:k, ...(dist[k]||{calls:0, ans:0, coord:0, other:0}), ...dakByDist[k]}));
  makeSortableTable('table-where-district', [
    {label:'District', key:'d'}, {label:'Calls', key:'calls', num:true}, {label:'Answered', key:'ans', num:true}, {label:'DAKs', key:'daks', num:true},
  ], drows.sort((a,b)=>b.calls-a.calls),
  r=>[esc(toTitle(r.d)), fmtNum(r.calls), fmtNum(r.ans), fmtNum(r.daks)]);

  const geo = await loadGeo();
  if(geo && document.getElementById('map-where')){
    const names = geo.features.map(f=>f.properties.district_name);
    plot('map-where', [{type:'choropleth', geojson:geo, featureidkey:'properties.district_name', locations:names,
      z: names.map(n=>(dist[normDist(n)]||{calls:0}).calls),
      text: names.map(n=>{ const s = dist[normDist(n)]; return `<b>${toTitle(n)}</b><br>${s?s.calls:0} calls` + (s?` · ${s.ans} answered`:''); }),
      hovertemplate:'%{text}<extra></extra>', colorscale:[[0,'#F2F4F1'],[0.0001,'#D6EEE3'],[1,'#1F6B4D']], zmin:0,
      marker:{line:{color:'#FFFFFF', width:0.8}}, colorbar:{title:{text:'Calls'}, thickness:10, len:0.55, outlinewidth:0}}],
      {height:440, margin:{t:0,b:0,l:0,r:0}, paper_bgcolor:'rgba(0,0,0,0)', font:FONT,
       geo:{fitbounds:'locations', visible:false, bgcolor:'rgba(0,0,0,0)'}});
  } else if(document.getElementById('map-where')){
    document.getElementById('map-where').innerHTML = '<p class="disclaimer">Map not available here - the district table has the same numbers.</p>';
  }
}

// ---------------------------------------------------------------- What Calls Are About
// Topics per call come from build_didi_ki_awaaz_data.py <- combine_call_coding.py: codes from a person's
// listening/review where available, otherwise Claude's reading of the redacted transcript. List values
// only - no notes, typed text or transcript text ever reach this page.
const CSC_THEME = 'CSC / VLE services (ID, registration, KYC, wallet recharge)';
const WOMEN_THEMES = ['Domestic violence','Dowry harassment','Harassment / threats / assault','Marriage / maintenance / divorce',
  'Child marriage','Cyber harassment / fake profile','Pension (old age / widow / disability)','Ration card / PDS','Housing (Awas Yojana)',
  'MGNREGA / wages / job card','Health / Ayushman card','Education / scholarship','Documents (Aadhaar, certificates, bank)',
  'Land / property dispute','Legal advice / police / court'];
// Calls with no actual question (returning a missed call, wrong number, telemarketing) are not a topic.
const NO_QUERY = ['Callback only (will call back / who called me)', 'Wrong number / spam / telemarketing'];
// short display names (the full name shows on hover)
const SHORT_LABEL = {
  'Pension (old age / widow / disability)': 'Pension', 'Documents (Aadhaar, certificates, bank)': 'Documents',
  'Cyber harassment / fake profile': 'Cyber harassment', 'Marriage / maintenance / divorce': 'Marriage dispute',
  'Wallet recharge (CLF cheque, beneficiary name, account, returned transfer)': 'Wallet recharge',
  "ID registration rejected / wrong account / can't register": 'ID registration rejected',
  'Waiting for ID approval / whitelisting': 'Waiting for ID approval', 'KYC / fingerprint / computer / login': 'KYC / login / computer',
  'Problems delivering a service (IRCTC, Tele-Law)': 'Using a service (IRCTC, Tele-Law)',
  'Took down details / registered the case': 'Took down details', 'Referred to block / government office': 'Referred to an office',
  'Referred to police / court / legal aid': 'Referred to police / legal aid', 'Just asked questions, nothing to resolve': 'Only asked questions',
  'Gave information / advice': 'Gave information', 'Help to solve a problem': 'Help with a problem',
  'Follow-up on an earlier case': 'Follow-up on a case', 'Complaint about a service or official': 'Complaint',
};
const shortLabel = s => SHORT_LABEL[s] || s;
const isWomen = c => WOMEN_THEMES.includes(c.lc.th) || WOMEN_THEMES.includes(c.lc.th2);
// Topic groups, checked in this order (a call about a woman's case counts there even if it came up during a
// case follow-up). Fixed colours, validated for colour-blind separation in this order.
const TOPIC_GROUPS = [
  ['Violence & entitlement cases', isWomen, '#C55F49', 'Domestic violence, dowry, harassment, family disputes, pension, documents - when it is the main or second topic of the call'],
  ['CSC set-up', c=>c.lc.th===CSC_THEME, '#CE9C3C', 'Setting up CSC services at the DAK: ID registration and approval, KYC, wallet recharge'],
  ['Case entry & follow-up', c=>['DAK case entry / MIS portal','DAK case follow-up'].includes(c.lc.th), '#2563A6', 'Entering or updating DAK cases in the MIS portal, and follow-ups on pending cases'],
  ['Programme admin & reports', c=>c.lc.th==='Programme admin (forms, data, meetings, training)', '#2F9C74', 'Forms, data and report requests, meetings, training'],
  ['Other', c=>true, '#B7BEB7', 'Programme information, funds, SHG and other topics'],
];
const isReal = c => c.lc && c.lc.th && /^yes/i.test(c.lc.rc||'');
const isTopical = c => isReal(c) && !NO_QUERY.includes(c.lc.th) && !/^can't tell$/i.test(c.lc.th);
const isChecked = c => c.lc && (c.lc.src==='listened' || c.lc.src==='reviewed');
const groupOf = c => TOPIC_GROUPS.find(g=>g[1](c));
let ABOUT_MONTH = 'all';

function donutTrace(labels, values, colors, hover){
  return {type:'pie', hole:0.58, labels, values, sort:false, direction:'clockwise', rotation:0,
    marker:{colors, line:{color:'#FFFFFF', width:2}}, texttemplate:'%{percent:.0%}', textposition:'inside', insidetextorientation:'horizontal',
    textfont:{color:'#FFFFFF', size:13}, hovertext:hover, hovertemplate:'%{hovertext}<extra></extra>'};
}
function donutLayout(total, word){
  return {height:330, margin:{t:10,b:10,l:10,r:10}, paper_bgcolor:'rgba(0,0,0,0)', showlegend:true,
    legend:{orientation:'v', x:1.02, y:0.5, yanchor:'middle', font:{size:13}},
    annotations:[{text:`<b>${fmtNum(total)}</b><br><span style="font-size:12px;color:#7C8B81">${word}</span>`, showarrow:false, font:{size:22, color:INK}}]};
}

function renderAbout(){
  const el = document.getElementById('panel-about');
  const all = DATA.calls.filter(isTopical);
  const ms = [...new Set(all.map(c=>c.d.slice(0,7)))].sort();
  if(ABOUT_MONTH !== 'all' && !ms.includes(ABOUT_MONTH)) ABOUT_MONTH = 'all';
  const calls = ABOUT_MONTH==='all' ? all : all.filter(c=>c.d.startsWith(ABOUT_MONTH));
  const periodName = ABOUT_MONTH==='all' ? `${monthLabel(ms[0])} – ${monthLabel(ms[ms.length-1])}` : monthLong(ABOUT_MONTH);
  const noQuery = DATA.calls.filter(c=>isReal(c) && NO_QUERY.includes(c.lc.th) && (ABOUT_MONTH==='all' || c.d.startsWith(ABOUT_MONTH))).length;
  const count = (list, f) => { const m = {}; list.forEach(c=>{ [].concat(f(c)).filter(Boolean).forEach(v=>{ m[v] = (m[v]||0) + 1; }); }); return Object.entries(m).sort((a,b)=>b[1]-a[1]); };
  const women = calls.filter(isWomen);
  const csc = calls.filter(c=>c.lc.th===CSC_THEME);
  const toggle = `<div class="seg-toggle" id="about-month">${[['all','All months'], ...ms.map(m=>[m, monthLabel(m)])].map(([k,l])=>
    `<button class="${k===ABOUT_MONTH?'on':''}" data-m="${k}">${l}</button>`).join('')}</div>`;

  el.innerHTML = `
    <section><div class="section-head"><h2 class="serif">What Calls Are About</h2>${toggle}</div>
      <div class="panel">
        <div class="donut-grid"><div id="chart-topic-donut"></div>
          <div class="topic-key">${TOPIC_GROUPS.map(([name,,color,desc])=>{ const n = calls.filter(c=>groupOf(c)[0]===name).length;
            return `<div class="topic-key-row"><span class="legend-swatch" style="background:${color}"></span><div><b>${name}</b> &middot; ${fmtNum(n)} call${n===1?'':'s'}<div class="topic-key-desc">${desc}</div></div></div>`; }).join('')}</div>
        </div>
        <p class="note-inline">${fmtNum(calls.length)} calls with a real question in ${periodName}. Not counted: ${fmtNum(noQuery)} short calls with no question (returning a missed call, wrong numbers), and calls that were silent, cut or too noisy.</p>
      </div></section>
    <section><div class="section-head"><h2 class="serif">Violence &amp; Entitlement Cases</h2><span class="hint">${fmtNum(women.length)} calls &middot; ${periodName}</span></div>
      <div class="panel"><div id="chart-women"></div></div></section>
    <section><div class="section-head"><h2 class="serif">CSC Set-up Problems</h2><span class="hint">${fmtNum(csc.length)} calls &middot; ${periodName}</span></div>
      <div class="panel"><div id="chart-csc"></div>
        <p class="note-inline">The same few questions keep coming back &mdash; the wallet cheque, which bank account to use, the centre name, how long approval takes. A one-page FAQ checked by the CSC team could answer most of them.</p></div></section>
    <section><div class="section-head"><h2 class="serif">Did Callers Get Help?</h2><span class="hint">${periodName}</span></div>
      <div class="panel two-col">
        <div><div class="chart-head" style="margin-top:0">Resolved on the call, by what the caller wanted <span class="soft">&middot; follow-ups and updates left out</span></div><div id="chart-resolved"></div></div>
        <div><div class="chart-head" style="margin-top:0">How the didi responded</div><div id="chart-resp"></div></div>
      </div></section>`;

  el.querySelectorAll('#about-month button').forEach(b=>b.addEventListener('click', ()=>{ ABOUT_MONTH = b.dataset.m; renderAbout(); }));

  // topic donut
  const g = TOPIC_GROUPS.map(([name,,color])=>({name, color, n: calls.filter(c=>groupOf(c)[0]===name).length})).filter(x=>x.n);
  plot('chart-topic-donut', [donutTrace(g.map(x=>x.name), g.map(x=>x.n), g.map(x=>x.color),
    g.map(x=>`<b>${x.name}</b><br>${x.n} calls · ${fmtPct(pct(x.n, calls.length),0)}`))],
    {...donutLayout(calls.length, 'calls'), showlegend:false});

  // women's cases: which issue (main or second topic), one bar each
  hbar('chart-women', count(women, c=>[c.lc.th, c.lc.th2].filter(t=>WOMEN_THEMES.includes(t))), {base: women.length, color:'#C55F49', unit:'calls'});
  hbar('chart-csc', count(csc, c=>c.lc.sub || 'Not specified'), {base: csc.length, color:C_GOLD});

  // resolved, by what the caller wanted: 100% stacked bars (status colours: yes / partly / no / unclear)
  const RES = [['Yes','Resolved',C_ANS], ['Partly','Partly',C_GOLD], ['No','Not resolved',C_MISS], ['?',"Couldn't tell",'#D9DDD8']];
  const resOf = c => ['Yes','Partly','No'].includes(c.lc.res) ? c.lc.res : '?';
  // only requests the didi could act on: follow-ups/updates and check-ins are left out (nothing to resolve)
  const wants = count(calls.filter(c=>c.lc.resp !== 'Just asked questions, nothing to resolve'),
    c=>c.lc.want && !/can't tell/i.test(c.lc.want) && c.lc.want !== 'Follow-up on an earlier case' ? c.lc.want : null).map(e=>e[0]).slice(0,5).reverse();
  plot('chart-resolved', RES.map(([k,label,color])=>{
    const n = wants.map(w=>calls.filter(c=>c.lc.resp!=='Just asked questions, nothing to resolve' && c.lc.want===w && resOf(c)===k).length);
    const tot = wants.map(w=>calls.filter(c=>c.lc.resp!=='Just asked questions, nothing to resolve' && c.lc.want===w).length);
    return {y: wants.map(w=>fitLabel(shortLabel(w))), x: n.map((v,i)=>pct(v, tot[i])), name:label, type:'bar', orientation:'h',
      marker:{color, line:{color:'#FFFFFF', width:1.5}},
      hovertext: n.map((v,i)=>`<b>${shortLabel(wants[i])}</b><br>${label}: ${v} of ${tot[i]} calls`), hovertemplate:'%{hovertext}<extra></extra>'};
  }), (()=>{ const l = hbarLayout(wants.length, {barmode:'stack', xmax:100});
      return {...l, height: l.height + 70, showlegend:true, legend:{orientation:'h', x:0, y:-0.08, yanchor:'top', traceorder:'normal'},
              margin:{t:6, b:70, l:10, r:10}}; })());

  // didi's response: donut
  const resp = count(calls, c=>c.lc.resp && !/can't tell/i.test(c.lc.resp) ? c.lc.resp : null);
  const RESP_COLORS = ['#2F9C74','#CE9C3C','#2563A6','#C55F49','#7C8B81','#B7BEB7'];
  const top = resp.slice(0,5), rest = resp.slice(5).reduce((a,e)=>a+e[1],0);
  const rows = rest ? [...top, ['Other responses', rest]] : top;
  const rTot = rows.reduce((a,e)=>a+e[1],0);
  plot('chart-resp', [donutTrace(rows.map(e=>shortLabel(e[0])), rows.map(e=>e[1]), RESP_COLORS.slice(0, rows.length),
    rows.map(e=>`<b>${esc(e[0])}</b><br>${e[1]} calls · ${fmtPct(pct(e[1], rTot),0)}`))],
    {...donutLayout(rTot, 'calls'), height:300, legend:{orientation:'h', x:0, y:-0.05, font:{size:12}}});
}
// ---------------------------------------------------------------- Outgoing Calls
// Calls the helpline makes ("Click to Call" in the portal). Who was called comes ONLY from matching the
// number with DAK records (done in the build script - numbers never reach this page). What was said on
// these calls is not analysed: their recordings have not been transcribed.
const OUT_COLOR = '#2563A6';
const OUT_TYPE_COLOR = {C:'#2563A6', A:'#C55F49', S:'#CE9C3C', U:'#2F9C74', N:'#B7BEB7'};
const OUT_TYPE_DESC = {
  C: "the coordinator's mobile number in DAK records",
  A: 'the contact number on a DAK case, not a staff number - may be the woman, a relative or a village worker',
  S: "a Sakshma Didi's mobile number in DAK records",
  U: 'not found in DAK records - often staff on other phones; could include women whose number is not on record',
  N: 'no number recorded',
};
let OUT_DISTRICT = '';
// outgoing calls clipped to the dates the incoming data covers, so the two compare fairly
function outCalls(){
  const all = (DATA.out_calls || []).filter(c=>c.d >= DATA.date_min && c.d <= DATA.date_max);
  return PERIOD==='cumulative' ? all : all.filter(c=>c.d.startsWith(PERIOD));
}
function renderOutgoing(){
  const el = document.getElementById('panel-outgoing');
  const out = outCalls(), inc = callsInPeriod();
  if(!(DATA.out_calls || []).length){
    el.innerHTML = `<section><div class="panel"><p class="disclaimer">No outgoing calls in the data yet. Run the scraper with --direction outbound and rebuild.</p></div></section>`;
    return;
  }
  const picked = out.filter(c=>c.a).length;
  const ratio = inc.length ? out.length / inc.length : null;
  const types = ['C','A','S','U','N'].map(k=>{ const cs = out.filter(c=>c.ct===k);
    return {k, label: DATA.out_types[k], calls: cs.length, ans: cs.filter(c=>c.a).length, nums: new Set(cs.map(c=>c.c)).size}; }).filter(t=>t.calls);
  const withNo = DATA.daks.map((d,i)=>({...d, i})).filter(d=>d.has_coord_no);
  const coordCalls = out.filter(c=>c.ct==='C' && c.dk!==null && c.dk!==undefined);
  const dakCalled = new Set(coordCalls.map(c=>c.dk)), dakSpoke = new Set(coordCalls.filter(c=>c.a).map(c=>c.dk));
  const missed = inc.filter(c=>!c.a && 'cb' in c);
  const placed = out.filter(c=>c.dk!==null && c.dk!==undefined);
  const cbBand = c => c.cb!==null && c.cb<=1 ? 'within 1 hour' : c.cb!==null && c.cb<=24 ? 'within 24 hours' : c.cb!==null && c.cb<=72 ? 'within 3 days'
    : c.rg ? 'not called back - got through by calling again' : c.cb!==null ? 'after more than 3 days' : 'not called back, did not get through';
  const BANDS = [['within 1 hour','#2F9C74'], ['within 24 hours','#7FBF9F'], ['within 3 days','#CE9C3C'], ['after more than 3 days','#D98A77'],
                 ['not called back - got through by calling again','#B7BEB7'], ['not called back, did not get through','#C55F49']];
  const cbs = missed.map(c=>c.cb).filter(v=>v!==null);
  const never = missed.filter(c=>cbBand(c)==='not called back, did not get through').length;

  el.innerHTML = `
    <section><div class="section-head"><h2 class="serif">Calls the Helpline Makes</h2><span class="hint">${periodLabel()} &middot; calls placed from the portal (&ldquo;Click to Call&rdquo;) &middot; data to ${dateLabel(DATA.date_max)}</span></div>
      <div class="panel">
        <div id="chart-out-volume"></div>
        <p class="note-inline">${ratio ? `For every call it received, the helpline made about <b>${fmtF(ratio,1)}</b> calls. ` : ''}${fmtNum(out.length)} outgoing calls, ${fmtPct(pct(picked, out.length),0)} picked up by the person called.</p>
      </div></section>
    <section><div class="section-head"><h2 class="serif">Who the Helpline Calls</h2><span class="hint">${periodLabel()} &middot; ${fmtNum(out.length)} calls</span></div>
      <div class="panel">
        <div class="donut-grid"><div id="chart-out-who"></div>
          <div class="topic-key">${types.map(t=>`<div class="topic-key-row"><span class="legend-swatch" style="background:${OUT_TYPE_COLOR[t.k]}"></span><div><b>${t.label}</b> &middot; ${fmtNum(t.calls)} calls<div class="topic-key-desc">${OUT_TYPE_DESC[t.k]}${t.k==='N' ? '.' : `. ${fmtNum(t.nums)} number${t.nums===1?'':'s'}, ${fmtPct(pct(t.ans,t.calls),0)} picked up.`}</div></div></div>`).join('')}</div>
        </div>
        <p class="note-inline">Who was called is known only from the phone number. What was said on these calls is not analysed yet, so their purpose is not shown here.</p>
      </div></section>
    <section><div class="section-head"><h2 class="serif">Where Outgoing Calls Go</h2><span class="hint">${periodLabel()} &middot; ${fmtNum(placed.length)} of ${fmtNum(out.length)} calls went to a number linked to a DAK</span></div>
      <div class="panel"><div id="map-out"></div>
        <p class="note-inline">District of the DAK the called number belongs to (coordinator, Sakshma Didi or a number listed on a DAK case). Calls to numbers not in DAK records can't be placed.</p></div></section>
    <section><div class="section-head"><h2 class="serif">DAKs the Helpline Calls</h2><span class="hint">${periodLabel()} &middot; calls to coordinator numbers &middot; ${fmtNum(dakCalled.size)} of ${fmtNum(withNo.length)} DAKs called, ${fmtNum(dakSpoke.size)} reached</span></div>
      <div class="panel">
        <div class="md-grid">
          <div><div class="chart-head" style="margin-top:0">Districts <span class="soft">&middot; click one</span></div><div id="chart-out-districts"></div></div>
          <div><div class="chart-head" style="margin-top:0" id="out-dak-title"></div><div id="chart-out-daks"></div></div>
        </div>
      </div></section>
    <section><div class="section-head"><h2 class="serif">Were Missed Calls Called Back?</h2><span class="hint">${periodLabel()} &middot; ${fmtNum(missed.length)} unanswered incoming calls from a known number</span></div>
      <div class="panel">
        <div id="chart-callbacks"></div>
        <p class="note-inline">A callback is any later outgoing call to the same number, whatever it was about. ${cbs.length ? `When there was one, the typical wait was <b>${fmtF(median(cbs) >= 24 ? median(cbs)/24 : median(cbs), median(cbs) >= 24 ? 1 : 0)} ${median(cbs) >= 24 ? 'days' : 'hours'}</b>. ` : ''}${fmtNum(never)} missed calls were neither called back nor followed by a call that got through.</p>
      </div></section>
    <section><div class="section-head"><h2 class="serif">Outgoing Calls by Agent</h2><span class="hint">${periodLabel()}</span></div>
      <div class="panel"><div id="chart-out-agents"></div></div></section>`;

  // 1. outgoing vs incoming by month - grouped bars, one axis
  const ms = [...new Set([...out, ...inc].map(c=>c.d.slice(0,7)))].sort();
  plot('chart-out-volume', [
    {x: ms.map(monthLabel), y: ms.map(m=>out.filter(c=>c.d.startsWith(m)).length), name:'Outgoing', type:'bar', marker:{color:OUT_COLOR},
     customdata: ms.map(m=>{ const o = out.filter(c=>c.d.startsWith(m)); return fmtPct(pct(o.filter(c=>c.a).length, o.length),0); }),
     hovertemplate:'<b>Outgoing</b> %{x}: %{y} calls (%{customdata} picked up)<extra></extra>'},
    {x: ms.map(monthLabel), y: ms.map(m=>inc.filter(c=>c.d.startsWith(m)).length), name:'Incoming', type:'bar', marker:{color:C_ANS},
     customdata: ms.map(m=>{ const o = inc.filter(c=>c.d.startsWith(m)); return fmtPct(pct(o.filter(c=>c.a).length, o.length),0); }),
     hovertemplate:'<b>Incoming</b> %{x}: %{y} calls (%{customdata} answered)<extra></extra>'},
  ], {...plotlyBarLayout('Calls'), barmode:'group', height:290, bargap:0.35, bargroupgap:0.08, margin:{t:36,b:40,l:55,r:20},
      legend:{orientation:'h', x:0, y:1.16, traceorder:'normal'}, yaxis:{title:{text:'Calls'}, gridcolor:GRID, zeroline:false, automargin:true},
      xaxis:{type:'category', automargin:true}});

  // map: outgoing calls by district of the DAK the number belongs to (blue = outgoing)
  const outDist = {};
  placed.forEach(c=>{ const k = normDist(DATA.daks[c.dk].district); const x = outDist[k] = outDist[k] || {calls:0, ans:0}; x.calls++; if(c.a) x.ans++; });
  loadGeo().then(geo=>{
    const host = document.getElementById('map-out');
    if(!host) return;
    if(!geo){ host.innerHTML = '<p class="disclaimer">Map not available here - the district chart below has the same numbers.</p>'; return; }
    const names = geo.features.map(f=>f.properties.district_name);
    plot('map-out', [{type:'choropleth', geojson:geo, featureidkey:'properties.district_name', locations:names,
      z: names.map(n=>(outDist[normDist(n)]||{calls:0}).calls),
      text: names.map(n=>{ const x = outDist[normDist(n)]; return `<b>${toTitle(n)}</b><br>${x ? x.calls : 0} outgoing calls` + (x ? ` · ${x.ans} reached` : ''); }),
      hovertemplate:'%{text}<extra></extra>', colorscale:[[0,'#F2F4F1'],[0.0001,'#DCE7F3'],[1,'#1F4E86']], zmin:0,
      marker:{line:{color:'#FFFFFF', width:0.8}}, colorbar:{title:{text:'Calls'}, thickness:10, len:0.55, outlinewidth:0}}],
      {height:440, margin:{t:0,b:0,l:0,r:0}, paper_bgcolor:'rgba(0,0,0,0)', font:FONT,
       geo:{fitbounds:'locations', visible:false, bgcolor:'rgba(0,0,0,0)'}});
  });

  // 2. who is called - donut
  plot('chart-out-who', [donutTrace(types.map(t=>t.label), types.map(t=>t.calls), types.map(t=>OUT_TYPE_COLOR[t.k]),
    types.map(t=>`<b>${t.label}</b><br>${t.calls} calls · ${fmtPct(pct(t.ans,t.calls),0)} picked up`))],
    {...donutLayout(out.length, 'calls'), showlegend:false});

  // 3. districts -> DAKs (calls to coordinator numbers)
  const byD = {};
  DATA.daks.forEach(d=>{ byD[toTitle(d.district)] = byD[toTitle(d.district)] || {k: toTitle(d.district), calls:0, ans:0, daks:{}}; });
  coordCalls.forEach(c=>{ const d = DATA.daks[c.dk], g = byD[toTitle(d.district)]; g.calls++; if(c.a) g.ans++;
    const x = g.daks[c.dk] = g.daks[c.dk] || {d, calls:0, ans:0}; x.calls++; if(c.a) x.ans++; });
  const distRows = Object.values(byD).sort((a,b)=>b.calls-a.calls || a.k.localeCompare(b.k));
  const bars = (id, rows, label, hover, color, hi) => {
    const rr = rows.slice().reverse(), l = hbarLayout(rr.length);
    plot(id, [{y: rr.map(r=>fitLabel(label(r))), x: rr.map(r=>r.calls), type:'bar', orientation:'h',
      marker:{color: rr.map(r=>hi && hi(r) ? C_GOLD : color)},
      text: rr.map(r=>r.calls ? `  ${r.calls} · ${fmtPct(pct(r.ans, r.calls),0)} reached` : '  no calls'), textposition:'outside', cliponaxis:false,
      textfont:{size:11.5, color:INK}, hovertext: rr.map(hover), hovertemplate:'%{hovertext}<extra></extra>'}],
      {...l, height: 20 + 24*rr.length, bargap:0.3, margin:{...l.margin, r:110}, yaxis:{...l.yaxis, type:'category', tickfont:{size:11.5, color:INK}}});
  };
  const drawDaks = () => {
    const title = document.getElementById('out-dak-title');
    let rows, label;
    if(!OUT_DISTRICT){
      rows = distRows.flatMap(g=>Object.values(g.daks)).sort((a,b)=>b.calls-a.calls).slice(0,12);
      title.innerHTML = `Most-called DAKs <span class="soft">&middot; all districts</span>`;
      label = x=>`${toTitle(x.d.block)}, ${toTitle(x.d.district)}`;
    } else {
      rows = Object.values(byD[OUT_DISTRICT].daks).sort((a,b)=>b.calls-a.calls);
      title.innerHTML = `${esc(OUT_DISTRICT)} <span class="soft">&middot; ${rows.length} DAK${rows.length===1?'':'s'} called &middot; <a href="#" id="out-reset">show all districts</a></span>`;
      label = x=>toTitle(x.d.block);
    }
    if(!rows.length) document.getElementById('chart-out-daks').innerHTML = '<p class="disclaimer">The helpline has not called any DAK coordinator in this district.</p>';
    else bars('chart-out-daks', rows, label, x=>`<b>${toTitle(x.d.name)}</b><br>${toTitle(x.d.block)}, ${toTitle(x.d.district)}<br>${x.calls} calls · ${x.ans} reached`, OUT_COLOR);
    const r = document.getElementById('out-reset');
    if(r) r.addEventListener('click', e=>{ e.preventDefault(); OUT_DISTRICT = ''; drawAll(); });
  };
  const drawAll = () => {
    bars('chart-out-districts', distRows, r=>r.k, r=>`<b>${r.k}</b><br>${r.calls} calls to ${Object.keys(r.daks).length} DAK coordinator${Object.keys(r.daks).length===1?'':'s'} · ${r.ans} reached<br>click to see its DAKs`,
      '#7FA6CF', r=>r.k===OUT_DISTRICT);
    document.getElementById('chart-out-districts').on('plotly_click', ev=>{ OUT_DISTRICT = distRows.slice().reverse()[ev.points[0].pointIndex].k; drawAll(); });
    drawDaks();
  };
  drawAll();

  // 4. callbacks - one bar per outcome, ordered from best to worst
  const cbRows = BANDS.map(([k,color])=>({k, color, n: missed.filter(c=>cbBand(c)===k).length})).filter(r=>r.n).reverse();
  const cl = hbarLayout(cbRows.length);
  plot('chart-callbacks', [{y: cbRows.map(r=>fitLabel(r.k.charAt(0).toUpperCase()+r.k.slice(1))), x: cbRows.map(r=>r.n), type:'bar', orientation:'h',
    marker:{color: cbRows.map(r=>r.color)}, text: cbRows.map(r=>`  ${r.n} · ${fmtPct(pct(r.n, missed.length),0)}`), textposition:'outside', cliponaxis:false,
    textfont:{size:12, color:INK}, hovertext: cbRows.map(r=>`<b>${r.k}</b><br>${r.n} of ${missed.length} missed calls`), hovertemplate:'%{hovertext}<extra></extra>'}],
    {...cl, yaxis:{...cl.yaxis, type:'category'}});

  // 5. agents
  const ag = {};
  out.filter(c=>c.ag).forEach(c=>{ const s = ag[c.ag] = ag[c.ag] || {name:c.ag, calls:0, ans:0, talk:0}; s.calls++; if(c.a) s.ans++; s.talk += c.talk; });
  const agRows = Object.values(ag).sort((a,b)=>b.calls-a.calls).reverse();
  const al = hbarLayout(agRows.length);
  plot('chart-out-agents', [{y: agRows.map(r=>r.name), x: agRows.map(r=>r.calls), type:'bar', orientation:'h', marker:{color:OUT_COLOR},
    text: agRows.map(r=>`  ${r.calls} calls · ${fmtPct(pct(r.ans, r.calls),0)} picked up`), textposition:'outside', cliponaxis:false, textfont:{size:12, color:INK},
    hovertext: agRows.map(r=>`<b>${r.name}</b><br>${r.calls} calls made · ${r.ans} picked up<br>${fmtF(r.talk/3600,1)} hours of talk`), hovertemplate:'%{hovertext}<extra></extra>'}],
    {...al, margin:{...al.margin, r:200}, yaxis:{...al.yaxis, type:'category'}});
}
// ---------------------------------------------------------------- Excel export (same approach as Statewide/index.html)
// Summary tables for the selected period only - the same numbers the page shows. No call-by-call rows.
function excelDownload(sheets, filename){
  const wb = XLSX.utils.book_new();
  sheets.forEach(([name, rows])=>{
    const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{'No data':''}]);
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0,31));   // Excel sheet-name limit
  });
  XLSX.writeFile(wb, filename);
}
function exportExcel(){
  const inc = callsInPeriod(), out = outCalls(), h = headline(inc);
  const r1 = v => v===null || v===undefined || isNaN(v) ? null : Math.round(v*10)/10;
  const period = periodLabel();

  const summary = [
    {Measure:'Period', Value: PERIOD==='cumulative' ? `${dateLabel(DATA.date_min)} - ${dateLabel(DATA.date_max)}` : period},
    {Measure:'Incoming calls', Value: h.total}, {Measure:'Incoming answered', Value: h.ans}, {Measure:'Incoming missed', Value: h.miss},
    {Measure:'Answer rate %', Value: r1(h.rate)}, {Measure:'Different callers', Value: h.callers},
    {Measure:'Callers never reached', Value: h.never}, {Measure:'Median wait before pickup (sec)', Value: h.waitMed},
    {Measure:'Outgoing calls', Value: out.length}, {Measure:'Outgoing picked up', Value: out.filter(c=>c.a).length},
    {Measure:'Outgoing picked up %', Value: r1(pct(out.filter(c=>c.a).length, out.length))},
    {Measure:'Data as of', Value: DATA.generated_at},
  ];

  const ms = [...new Set([...inc, ...out].map(c=>c.d.slice(0,7)))].sort();
  const monthly = ms.map(m=>{ const i = inc.filter(c=>c.d.startsWith(m)), o = out.filter(c=>c.d.startsWith(m));
    return {Month: monthLong(m), 'Incoming calls': i.length, 'Incoming answered': i.filter(c=>c.a).length,
      'Answer rate %': r1(pct(i.filter(c=>c.a).length, i.length)), 'Outgoing calls': o.length, 'Outgoing picked up': o.filter(c=>c.a).length}; });

  const outBy = {};
  out.filter(c=>c.ag).forEach(c=>{ const s = outBy[c.ag] = outBy[c.ag] || {calls:0, ans:0}; s.calls++; if(c.a) s.ans++; });
  const agents = agentStats(inc).map(r=>({Rank: r.rank, Agent: r.name, 'Score %': r1(r.score), 'Pickup rate %': r1(r.pickup),
    'Incoming calls rung': r.rung, 'Incoming answered': r.ans, 'Resolved rate %': r1(r.resolved),
    'Resolved (calls)': r.resKnown ? `${r.resYes} of ${r.resKnown}` : '', 'Median pickup (sec)': r.ringMed,
    'Avg talk (sec)': r.talkAvg===null ? null : Math.round(r.talkAvg),
    'Outgoing calls made': (outBy[r.name]||{}).calls || 0, 'Outgoing picked up': (outBy[r.name]||{}).ans || 0}));
  Object.keys(outBy).filter(n=>!agents.some(a=>a.Agent===n)).forEach(n=>agents.push({Agent:n, 'Outgoing calls made': outBy[n].calls, 'Outgoing picked up': outBy[n].ans}));

  const dk = {};
  const touch = i => dk[i] = dk[i] || {inc:0, incAns:0, out:0, outAns:0};
  inc.filter(c=>c.dk!==null && c.dk!==undefined).forEach(c=>{ const s = touch(c.dk); s.inc++; if(c.a) s.incAns++; });
  out.filter(c=>c.dk!==null && c.dk!==undefined).forEach(c=>{ const s = touch(c.dk); s.out++; if(c.a) s.outAns++; });
  const daks = Object.entries(dk).map(([i,s])=>{ const d = DATA.daks[i];
    return {DAK: toTitle(d.name), District: toTitle(d.district), Block: toTitle(d.block), 'Incoming calls': s.inc, 'Incoming answered': s.incAns,
      'Outgoing calls': s.out, 'Outgoing reached': s.outAns}; }).sort((a,b)=>(b['Incoming calls']+b['Outgoing calls'])-(a['Incoming calls']+a['Outgoing calls']));
  const dist = {};
  daks.forEach(r=>{ const s = dist[r.District] = dist[r.District] || {District:r.District, 'DAKs in touch':0, 'Incoming calls':0, 'Incoming answered':0, 'Outgoing calls':0, 'Outgoing reached':0};
    s['DAKs in touch']++; ['Incoming calls','Incoming answered','Outgoing calls','Outgoing reached'].forEach(k=>{ s[k] += r[k]; }); });

  const topical = inc.filter(isTopical);
  const topics = TOPIC_GROUPS.map(([name])=>({Topic: name, Calls: topical.filter(c=>groupOf(c)[0]===name).length}));
  const women = topical.filter(isWomen), wc = {};
  women.forEach(c=>[c.lc.th, c.lc.th2].filter(t=>WOMEN_THEMES.includes(t)).forEach(t=>{ wc[t] = (wc[t]||0) + 1; }));
  const csc = topical.filter(c=>c.lc.th===CSC_THEME), cc = {};
  csc.forEach(c=>{ const k = c.lc.sub || 'Not specified'; cc[k] = (cc[k]||0) + 1; });
  const topicRows = [...topics, {}, ...Object.entries(wc).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({Topic:`Violence & entitlement: ${k}`, Calls:v})),
    {}, ...Object.entries(cc).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({Topic:`CSC problem: ${k}`, Calls:v}))];

  const miss = inc.filter(c=>!c.a);
  const missedRows = Object.entries(MISS_REASONS).map(([k,v])=>({'What happened': v.label, Calls: miss.filter(c=>c.why===k).length}));
  const known = inc.filter(c=>!c.a && 'cb' in c);
  const band = c => c.cb!==null && c.cb<=1 ? 'Called back within 1 hour' : c.cb!==null && c.cb<=24 ? 'Called back within 24 hours'
    : c.cb!==null && c.cb<=72 ? 'Called back within 3 days' : c.rg ? 'Not called back - got through by calling again'
    : c.cb!==null ? 'Called back after more than 3 days' : 'Not called back, did not get through';
  const cbc = {}; known.forEach(c=>{ const k = band(c); cbc[k] = (cbc[k]||0) + 1; });
  const callbackRows = Object.entries(cbc).map(([k,v])=>({'After a missed call (known number)': k, Calls: v}));

  excelDownload([
    ['Summary', summary], ['By month', monthly], ['Agents', agents], ['DAKs', daks],
    ['Districts', Object.values(dist).sort((a,b)=>b['Outgoing calls']-a['Outgoing calls'])],
    ['Topics', topicRows], ['Missed calls', missedRows], ['Callbacks', callbackRows],
  ], `Didi_ki_Awaaz_Helpline_${PERIOD}.xlsx`);
}
function toTitle(s){ return String(s||'').toLowerCase().replace(/\b\w/g, ch=>ch.toUpperCase()); }

// ---------------------------------------------------------------- When Calls Come In
function renderPatterns(){
  const calls = callsInPeriod();
  const el = document.getElementById('panel-patterns');
  const hours = [...new Set(calls.map(c=>c.h))].sort((a,b)=>a-b);
  const lines = DATA.lines.map((n,i)=>{ const cs = calls.filter(c=>c.ln===i); return {n, total:cs.length, ans:cs.filter(c=>c.a).length}; }).filter(x=>x.total).sort((a,b)=>b.total-a.total);
  el.innerHTML = `
    <section><div class="section-head"><h2 class="serif">By Hour of Day</h2><span class="hint">calls on top, answer rate below &middot; hover for counts</span></div>
      <div class="panel"><div id="chart-hour"></div></div></section>
    <section><div class="section-head"><h2 class="serif">By Day of Week</h2><span class="hint">calls on top, answer rate below &middot; hover for counts</span></div>
      <div class="panel"><div id="chart-weekday"></div></div></section>
    <section><div class="section-head"><h2 class="serif">By Helpline Number</h2><span class="hint">which number the caller dialled</span></div>
      <div class="panel"><div id="chart-lines"></div></div></section>`;
  const fmtLine = n => String(n).replace(/^\+91(\d{5})(\d{5})$/, '+91 $1 $2');
  plot('chart-lines', [{y: lines.slice().reverse().map(x=>fmtLine(x.n)), x: lines.slice().reverse().map(x=>x.total), type:'bar', orientation:'h', marker:{color:C_BLUE},
    text: lines.slice().reverse().map(x=>`  ${fmtNum(x.total)} calls · ${fmtPct(pct(x.ans,x.total),0)} answered`), textposition:'outside', cliponaxis:false, textfont:{size:12, color:INK},
    hovertext: lines.slice().reverse().map(x=>`<b>${x.n}</b><br>${x.total} calls, ${x.ans} answered`), hovertemplate:'%{hovertext}<extra></extra>'}],
    (()=>{ const l = hbarLayout(lines.length); return {...l, margin:{t:6, b:6, l:40, r:220}, yaxis:{...l.yaxis, type:'category', automargin:true}}; })());
  const hl = h => `${String(h).padStart(2,'0')}:00`;
  volumeRateChart('chart-hour', hours.map(hl), hours.map(h=>calls.filter(c=>c.h===h&&c.a).length), hours.map(h=>calls.filter(c=>c.h===h&&!c.a).length));
  volumeRateChart('chart-weekday', WEEKDAYS, WEEKDAYS.map((_,i)=>calls.filter(c=>c.wd===i&&c.a).length), WEEKDAYS.map((_,i)=>calls.filter(c=>c.wd===i&&!c.a).length));
}

// ---------------------------------------------------------------- boot
async function boot(){
  initTooltips();
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-backdrop').addEventListener('click', e=>{ if(e.target.id==='modal-backdrop') closeModal(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
  document.getElementById('btn-print').addEventListener('click', ()=>window.print());
  document.getElementById('btn-export-excel').addEventListener('click', exportExcel);
  // Standalone review copy (export_didi_ki_awaaz_standalone.py) embeds the payload here - no fetch, works by double-click.
  if(window.EMBEDDED_DATA){
    DATA = window.EMBEDDED_DATA;
    document.querySelector('.back-link').style.display = 'none';
  }else if(location.protocol==='file:'){
    document.getElementById('banner').innerHTML = `<div class="status-banner">This page loads its data with fetch(), which browsers block for files opened directly. Serve the folder instead: run <code>python -m http.server</code> in the Statewide folder and open http://localhost:8000/didi-ki-awaaz.html</div>`;
    return;
  }
  if(!DATA) try{
    const r = await fetch('data/didi_ki_awaaz.json', {cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    DATA = await r.json();
  }catch(e){
    document.getElementById('banner').innerHTML = `<div class="status-banner">Couldn't load data/didi_ki_awaaz.json (${esc(e.message)}). Run build_didi_ki_awaaz_data.py first.</div>`;
    return;
  }
  const hash = location.hash.slice(1);
  if(TABS.some(([k])=>k===hash)) ACTIVE_TAB = hash;
  document.querySelectorAll('.tabpanel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+ACTIVE_TAB));
  renderMasthead(); renderTabbar(); renderTab(ACTIVE_TAB);
}
boot();
</script>
