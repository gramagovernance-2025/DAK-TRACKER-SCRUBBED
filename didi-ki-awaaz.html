<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Didi ki Awaaz Helpline — DAK Tracker</title>
<style>
/* Design tokens + components copied from Statewide/index.html (duplicated, not
   shared - same precedent as the rest of this project). Keep in sync by hand. */
:root{
  --ground:#FFFFFF; --panel:#FFFFFF; --panel-alt:#FAF9F4; --ink:#33413A; --ink-soft:#7C8B81;
  --primary:#2F9C74; --primary-soft:#E7F5EF; --gold:#CE9C3C; --gold-soft:#FBF1DA;
  --line:#EAE4D5; --line-strong:#DCD2BB; --low:#C55F49; --low-soft:#FBE8E1;
  --grey:#B7BEB7; --grey-soft:#EFF1EE;
}
*{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Noto Sans Devanagari","Nirmala UI",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.5; padding:18px 16px 50px;
}
.page{ max-width:1040px; margin:0 auto; }
.serif{ font-family:"Iowan Old Style","Palatino Linotype",Georgia,"Noto Sans Devanagari",serif; }
.top-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
.badge{ display:inline-flex; align-items:center; gap:6px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; color:var(--primary); background:var(--primary-soft); border:1px solid var(--line-strong); border-radius:999px; padding:5px 12px; }
.badge::before{ content:"\25CF"; font-size:8px; }
.icon-btn{ appearance:none; cursor:pointer; font-family:inherit; font-size:12.5px; font-weight:600; color:var(--ink-soft); background:var(--panel-alt); border:1px solid var(--line-strong); border-radius:999px; padding:7px 14px; display:inline-flex; align-items:center; gap:6px; }
.icon-btn:hover{ color:var(--ink); border-color:var(--ink-soft); }
header.masthead{ border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:16px; }
h1{ font-weight:600; font-size:clamp(24px,5vw,32px); margin:2px 0 4px 0; text-wrap:balance; letter-spacing:-0.01em; }
.crumbs{ color:var(--ink-soft); font-size:13.5px; }
.crumbs b{ color:var(--ink); font-weight:600; }
.back-link{ appearance:none; border:none; background:none; cursor:pointer; font-family:inherit; font-size:13px; font-weight:600; color:var(--primary); padding:0; margin-bottom:8px; display:inline-flex; align-items:center; gap:4px; text-decoration:none; }
.back-link:hover{ text-decoration:underline; }
.tabbar{ display:flex; gap:4px; margin-bottom:6px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.tabbtn{ appearance:none; border:none; background:none; cursor:pointer; font-family:inherit; font-size:14.5px; font-weight:600; color:var(--ink-soft); padding:11px 4px; margin-right:20px; border-bottom:2px solid transparent; min-height:42px; }
@media (max-width:640px){
  .tabbar{ flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tabbtn{ white-space:nowrap; flex:none; }
}
.tabbtn:hover{ color:var(--ink); }
.tabbtn.active{ color:var(--primary); border-bottom-color:var(--primary); }
.tabpanel{ display:none; padding-top:12px; } .tabpanel.active{ display:block; }
section{ margin-bottom:30px; }
.section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
.section-head h2{ font-size:18px; font-weight:600; margin:0; }
.section-head .hint{ font-size:12.5px; color:var(--ink-soft); }
.panel{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:20px 22px; }
.panel-highlight{ background:var(--primary-soft); border:1.5px solid var(--primary); }
.cat-block{ padding-top:20px; margin-top:20px; border-top:1px solid var(--line); }
.cat-block:first-child{ padding-top:0; margin-top:0; border-top:none; }
.cat-block-head{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:10px; }
.tiles{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; }
.tile{ border:1px solid var(--line); border-radius:8px; padding:12px 14px; background:var(--panel); }
.tile .label{ font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px; }
.tile .label.tip{ cursor:help; text-decoration:underline dotted var(--line-strong); text-underline-offset:3px; }
.tile .value{ font-size:21px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--primary); word-break:break-word; }
.tile.neutral .value{ color:var(--ink); }
.tile.neg .value{ color:var(--low); } .tile.warn .value{ color:var(--gold); }
.tile .sub{ font-size:12px; color:var(--ink-soft); margin-top:4px; }
.table-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
table{ width:100%; border-collapse:collapse; }
thead th{ text-align:left; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); font-weight:600; padding:0 10px 9px; border-bottom:1px solid var(--line-strong); white-space:nowrap; }
thead th.num, tbody td.num{ text-align:right; }
tbody tr{ border-bottom:1px solid var(--line); } tbody tr:last-child{ border-bottom:none; }
tbody tr:hover{ background:var(--panel-alt); cursor:default; }
tbody tr.clickable:hover{ cursor:pointer; }
tbody td{ padding:9px 10px; vertical-align:middle; font-variant-numeric:tabular-nums; }
th.sortable{ cursor:pointer; user-select:none; }
th.sortable:hover{ color:var(--ink); }
.sort-arrow{ font-size:9px; margin-left:4px; color:var(--line-strong); display:inline-block; }
.sort-arrow.active{ color:var(--primary); }
.score-cell{ display:flex; align-items:center; gap:10px; justify-content:flex-end; }
.score-bar{ width:56px; height:6px; border-radius:999px; background:var(--line); position:relative; flex:none; }
.score-bar .fill{ position:absolute; left:0; top:0; bottom:0; border-radius:999px; background:var(--primary); }
.score-num{ width:38px; text-align:right; font-weight:600; }
.status-tag{ font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap; display:inline-block; }
.status-tag.na{ color:var(--ink-soft); background:var(--grey-soft); }
.bar-list{ display:flex; flex-direction:column; gap:9px; }
.bar-row{ display:grid; grid-template-columns:190px 1fr 110px; gap:12px; align-items:center; }
@media (max-width:560px){ .bar-row{ grid-template-columns:1fr; gap:3px; } .bar-row .bval{ text-align:left; } }
.bar-row .blabel{ font-size:13px; color:var(--ink); }
.bar-track{ position:relative; height:8px; border-radius:999px; background:var(--grey-soft); }
.bar-track .fill{ position:absolute; left:0; top:0; bottom:0; border-radius:999px; }
.bar-row .bval{ font-size:12.5px; font-weight:700; text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.donut-row{ display:flex; gap:20px; flex-wrap:wrap; justify-content:center; align-items:center; }
.donut-wrap{ position:relative; margin:0 auto; }
.donut-slice{ cursor:pointer; }
.donut-legend{ display:flex; flex-direction:column; gap:7px; }
.legend-row{ display:flex; align-items:center; gap:8px; font-size:12.5px; }
.legend-swatch{ width:10px; height:10px; border-radius:3px; flex:none; }
.legend-row .amt{ margin-left:auto; font-variant-numeric:tabular-nums; color:var(--ink-soft); padding-left:6px; }
.legend-row-wrap{ display:flex; flex-wrap:wrap; gap:8px 20px; margin-top:12px; }
.foot-note{ margin-top:20px; font-size:12.5px; color:var(--ink-soft); border-top:1px solid var(--line); padding-top:12px; }
.note-inline{ font-size:13px; line-height:1.55; color:var(--ink-soft); background:var(--panel-alt); border-left:3px solid var(--line-strong); border-radius:0 8px 8px 0; padding:10px 14px; margin:16px 0 0; }
.note-inline b{ color:var(--ink); }
.chart-head{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin:24px 0 6px; }
.seg-toggle{ display:inline-flex; gap:2px; background:var(--grey-soft); border-radius:999px; padding:3px; flex-wrap:wrap; }
.seg-toggle button{ appearance:none; border:none; background:none; cursor:pointer; font-family:inherit; font-size:12.5px; font-weight:600; color:var(--ink-soft); padding:6px 12px; border-radius:999px; }
.seg-toggle button:hover{ color:var(--ink); }
.seg-toggle button.on{ background:var(--panel); color:var(--primary); box-shadow:0 1px 2px rgba(0,0,0,.08); }
.donut-grid{ display:grid; grid-template-columns:minmax(260px,1fr) 1.1fr; gap:24px; align-items:center; }
@media (max-width:760px){ .donut-grid{ grid-template-columns:1fr; } }
.topic-key{ display:flex; flex-direction:column; gap:14px; }
.topic-key-row{ display:flex; gap:10px; align-items:flex-start; font-size:14px; }
.topic-key-row .legend-swatch{ margin-top:5px; }
.topic-key-desc{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
.md-grid{ display:grid; grid-template-columns:1fr 1fr; gap:28px; align-items:start; }
@media (max-width:760px){ .md-grid{ grid-template-columns:1fr; } }
.chart-head .soft, .soft{ text-transform:none; letter-spacing:0; font-weight:400; color:var(--ink-soft); }
.chart-head a{ color:var(--primary); }
#chart-districts .bars path{ cursor:pointer; }
.dak-bar-head{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:6px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); }
.source-line{ font-size:12.5px; color:var(--ink-soft); margin:-8px 2px 24px; }
.callout-attn{ text-align:center; font-size:13.5px; font-weight:700; margin:0 0 8px; padding:11px 16px; background:var(--primary-soft); color:#1f6b4d; border-radius:8px; }
.callout-attn.low{ background:var(--low-soft); color:#8a3226; }
.cat-block .callout-attn{ margin:12px 0 0; }
.disclaimer{ font-size:13px; color:var(--gold); background:var(--gold-soft); border-radius:8px; padding:9px 13px; }
.status-banner{ display:flex; align-items:flex-start; gap:10px; font-size:13.5px; font-weight:700; padding:12px 16px; background:var(--low-soft); color:#8a3226; border:1px solid var(--low); border-radius:8px; margin-bottom:16px; }
.modal-backdrop{ display:none; position:fixed; inset:0; background:rgba(30,35,32,0.45); z-index:100; align-items:center; justify-content:center; padding:20px; }
.modal-backdrop.open{ display:flex; }
.modal{ background:var(--panel); border-radius:14px; max-width:580px; width:100%; max-height:88vh; overflow-y:auto; padding:24px 26px; box-shadow:0 20px 60px rgba(0,0,0,0.25); }
.modal-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; }
.modal-head h3{ font-size:17px; font-weight:600; margin:0; }
.modal-close{ appearance:none; border:none; background:none; cursor:pointer; font-size:22px; line-height:1; color:var(--ink-soft); padding:2px 6px; }
.modal-close:hover{ color:var(--ink); }
.mini-tiles{ display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; margin-bottom:14px; }
.mini-tile{ border:1px solid var(--line); border-radius:7px; padding:9px 11px; }
.mini-tile .label{ font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:4px; }
.mini-tile .value{ font-size:16px; font-weight:600; color:var(--ink); }
.rank3-table{ width:100%; border-collapse:collapse; margin-top:6px; font-size:12.5px; }
.rank3-table th{ text-align:left; color:var(--ink-soft); font-weight:600; padding:4px 6px; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; border-bottom:1px solid var(--line-strong); }
.rank3-table td{ padding:6px; border-bottom:1px solid var(--line); }
.rank3-table td.num, .rank3-table th.num{ text-align:right; font-variant-numeric:tabular-nums; }
.modal-subhead{ font-size:12.5px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; margin:16px 0 8px; }
.tooltip-box{ position:fixed; z-index:999; max-width:250px; background:var(--ink); color:#fff; font-size:12.5px;
  line-height:1.45; padding:8px 11px; border-radius:6px; pointer-events:none; opacity:0; transition:opacity .12s ease;
  transform:translate(-50%,calc(-100% - 10px)); }
.tooltip-box.visible{ opacity:1; }
[data-tip]{ cursor:help; }
.tip{ text-decoration:underline dotted var(--line-strong); text-underline-offset:3px; }
.heatmap-cell{ font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:6px; display:inline-block; min-width:44px; text-align:center; }
.heatmap-cell.zero{ color:var(--ink-soft); background:var(--grey-soft); font-weight:400; }
.masthead-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
.masthead-titleblock{ min-width:0; flex:1 1 auto; }
.period-picker{ display:flex; gap:8px; flex:none; margin-top:2px; }
.period-select{ font-family:inherit; font-size:13px; font-weight:600; color:var(--ink); background:var(--panel); border:1.5px solid var(--line-strong); border-radius:8px; padding:8px 10px; min-height:38px; }
.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.sub-chart-label{ font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); margin:6px 0 0 58px; }
details.more-table{ margin-top:12px; }
details.more-table summary{ cursor:pointer; font-size:13px; font-weight:600; color:var(--primary); padding:6px 0; }
details.more-table summary:hover{ text-decoration:underline; }
details.more-table[open] summary{ margin-bottom:8px; }
.sm-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
.sm-card{ border:1px solid var(--line); border-radius:8px; padding:10px 12px 2px; cursor:pointer; transition:border-color .12s, background .12s; }
.sm-card:hover{ border-color:var(--line-strong); background:var(--panel-alt); }
.sm-title{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; font-size:13.5px; font-weight:600; }
.sm-sub{ font-size:12px; font-weight:400; color:var(--ink-soft); margin-left:auto; }
@media (max-width:760px){ .two-col{ grid-template-columns:1fr; } }
.panel.two-col{ gap:28px; }
@media print{
  .tabbar, .icon-btn, #modal-backdrop, .period-picker{ display:none !important; }
  .tabpanel{ display:block !important; margin-bottom:34px; page-break-inside:avoid; }
  body{ padding:0; }
}
</style>

    <button class="icon-btn" id="btn-print">&#128424;&#65039; Print / Save as PDF</button></span>
  </div>

  <div class="tabpanel active" id="panel-overview"></div>
  <div class="tabpanel" id="panel-where"></div>

<div id="modal-backdrop" class="modal-backdrop"><div class="modal"><div class="modal-head"><h3 id="modal-title"></h3><button class="modal-close" id="modal-close">&times;</button></div><div id="modal-body"></div></div></div>

<script>
let DATA = null;
let PERIOD = 'cumulative';   // 'cumulative' | 'YYYY' | 'YYYY-MM' - same keys as the DAK dashboard's period picker
let ACTIVE_TAB = 'overview';
const MONTH_NAMES = {'01':'Jan','02':'Feb','03':'Mar','04':'Apr','05':'May','06':'Jun','07':'Jul','08':'Aug','09':'Sep','10':'Oct','11':'Nov','12':'Dec'};
const WEEKDAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const C_ANS = '#2F9C74', C_MISS = '#C55F49', C_GOLD = '#CE9C3C', C_BLUE = '#2A5C8C';
const MISS_REASONS = {
  before_ring:      {label:'Hung up before any agent was rung', color:'#C55F49'},
  while_ringing:    {label:'Hung up while agents were ringing', color:'#CE9C3C'},
  rang_out:         {label:'Rang out — no agent picked up',     color:'#8A6A1F'},
  line_unavailable: {label:'Agent line unavailable',            color:'#B7BEB7'},
};

// ---------------------------------------------------------------- helpers (same as Statewide/index.html)
function fmtNum(v){ return v===null||v===undefined ? '—' : Math.round(v).toLocaleString('en-IN'); }
function fmtF(v,d){ return v===null||v===undefined||isNaN(v) ? '—' : v.toFixed(d===undefined?1:d); }
function fmtPct(v,d){ return v===null||v===undefined||isNaN(v) ? '—' : v.toFixed(d===undefined?1:d)+'%'; }
function ord(n){ if(n===null||n===undefined) return ''; const s=['th','st','nd','rd'], v=Math.round(n)%100; return s[(v-20)%10]||s[v]||s[0]; }
function grade(pct){ if(pct===null||pct===undefined) return 'var(--grey)'; if(pct>=66) return 'var(--primary)'; if(pct>=33) return 'var(--gold)'; return 'var(--low)'; }
function gradeSoft(pct){ if(pct===null||pct===undefined) return 'var(--grey-soft)'; if(pct>=66) return 'var(--primary-soft)'; if(pct>=33) return 'var(--gold-soft)'; return 'var(--low-soft)'; }
function gradeCls(pct){ if(pct===null||pct===undefined) return 'neutral'; if(pct>=66) return ''; if(pct>=33) return 'warn'; return 'neg'; }
function esc(s){ return String(s===null||s===undefined?'':s).replace(/[&<>"]/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }
function median(arr){
  if(!arr.length) return null;
  const s = arr.slice().sort((a,b)=>a-b), mid = Math.floor(s.length/2);
  return s.length%2 ? s[mid] : (s[mid-1]+s[mid])/2;
}
function mean(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null; }
function pct(a,b){ return b ? 100*a/b : null; }
function fmtSecs(s){ if(s===null||s===undefined) return '—'; s=Math.round(s); return s<60 ? `${s}s` : `${Math.floor(s/60)}m ${String(s%60).padStart(2,'0')}s`; }
function monthLabel(m){ const [y,mm]=m.split('-'); return `${MONTH_NAMES[mm]} '${y.slice(2)}`; }
function monthLong(m){ const [y,mm]=m.split('-'); return `${MONTH_NAMES[mm]} ${y}`; }
function dateLabel(d){ const [y,m,dd]=d.split('-'); return `${+dd} ${MONTH_NAMES[m]} ${y}`; }

const TIPS = {
  'Answer Rate': 'Share of incoming calls that an agent picked up.',
  'Callers Never Reached': 'Callers who called at least once in this period and never got through on any call.',
  'Median Wait': 'Middle value of how long an answered caller waited — from the call connecting to an agent picking up.',
  'Avg Talk Time': 'Average conversation length on answered calls.',
  'Repeat Callers': 'Callers who called more than once in this period.',
  'First-Ring Pickup': 'Of calls where at least one agent was rung, the share picked up by the very first agent tried.',
  'Performance Score': 'Score = the average of her pickup rate and her resolved rate (50/50), both on her own calls - so getting fewer calls does not count against her. Agents with no coded calls yet are scored on pickup alone.',
  'Pickup Rate': 'Of the calls that rang this agent’s phone, the share she answered.',
  'Pickup Speed': 'Median seconds her phone rang before she answered (lower is faster).',
  'Share of Answered': 'Her share of all calls the team answered.',
  'Active Days': 'Days on which she answered at least one call.',
};

function tile(label, value, sub, cls, tip){
  const t = tip || TIPS[label];
  const v = (value===null||value===undefined) ? '—' : value;
  const l = t ? `<div class="label tip" data-tip="${t}">${label}</div>` : `<div class="label">${label}</div>`;
  return `<div class="tile ${cls||''}">${l}<div class="value">${v}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;
}
function miniTile(label, value, tip){
  const t = tip || TIPS[label];
  const l = t ? `<div class="label tip" data-tip="${t}">${label}</div>` : `<div class="label">${label}</div>`;
  return `<div class="mini-tile">${l}<div class="value">${value===null||value===undefined?'—':value}</div></div>`;
}
function barRow(label, val, max, color, valLabel, tip){
  const lbl = tip ? `<span class="tip" data-tip="${tip}">${label}</span>` : label;
  const w = max>0 ? Math.min(val/max*100,100) : 0;
  return `<div class="bar-row"><div class="blabel">${lbl}</div><div class="bar-track"><div class="fill" style="width:${w}%;background:${color}"></div></div><div class="bval">${valLabel!==undefined?valLabel:fmtNum(val)}</div></div>`;
}
function stackedBarChart(segments){
  const entries = segments.filter(s=>s.value>0);
  const total = entries.reduce((a,s)=>a+s.value,0);
  if(!total) return '<p class="disclaimer">No calls to show.</p>';
  const bar = `<div style="display:flex;height:26px;border-radius:7px;overflow:hidden;">
    ${entries.map(s=>`<div data-tip="${s.label}: ${fmtNum(s.value)} (${(s.value/total*100).toFixed(1)}%)" style="width:${(s.value/total*100).toFixed(2)}%;background:${s.color};"></div>`).join('')}
  </div>`;

  return bar + legend;
}
function makeSortableTable(containerId, cols, data, rowBuilder, onRowClick){
  const state = { col: null, dir: 1 };
  function draw(){
    const sorted = state.col === null ? data : data.slice().sort((a,b)=>{
      let av=a[cols[state.col].key], bv=b[cols[state.col].key];
      if(typeof av==='string'){ av=av.toUpperCase(); bv=(bv||'').toUpperCase(); }
      if(av==null) return 1; if(bv==null) return -1;
      if(av<bv) return -1*state.dir; if(av>bv) return 1*state.dir; return 0;
    });
    const theadHtml = `<tr>${cols.map((c,i)=>{
      const cls=[c.num?'num':'', c.key?'sortable':''].filter(Boolean).join(' ');
      const arrow = c.key ? ` <span class="sort-arrow${state.col===i?' active':''}">${state.col===i?(state.dir===1?'▲':'▼'):'⇅'}</span>` : '';
      const lbl = c.tip ? `<span class="tip" data-tip="${c.tip}">${c.label}</span>` : c.label;
      return `<th${cls?` class="${cls}"`:''}${c.key?` data-colidx="${i}"`:''}>${lbl}${arrow}</th>`;
    }).join('')}</tr>`;
    const tbodyHtml = sorted.map((item,idx)=>{
      const r = rowBuilder(item, idx);
      const cls = onRowClick && onRowClick.enabled(item) ? ' class="clickable"' : '';
      return `<tr${cls} data-idx="${idx}">${r.map((v,i)=>`<td${cols[i].num?' class="num"':''}>${v}</td>`).join('')}</tr>`;
    }).join('');
    document.getElementById(containerId).innerHTML = `<div class="table-wrap"><table><thead>${theadHtml}</thead><tbody>${tbodyHtml}</tbody></table></div>`;
    document.querySelectorAll(`#${containerId} th.sortable`).forEach(th=>{
      th.addEventListener('click', ()=>{
        const idx = +th.dataset.colidx;
        if(state.col===idx) state.dir*=-1; else { state.col=idx; state.dir=1; }
        draw();
      });
    });
    if(onRowClick){
      document.querySelectorAll(`#${containerId} tbody tr.clickable`).forEach(tr=>{
        tr.addEventListener('click', ()=> onRowClick.handler(sorted[+tr.dataset.idx]));
      });
    }
  }
  draw();
}

  return words.length ? `${a}<br>${words.join(' ')}` : a;
}

// Donut/pie - same drawing as drawDonut() in index.html. segs: [{label, value, color}]
function drawDonut(svgId, segments){
  const svg=document.getElementById(svgId); if(!svg) return;
  const r=65,cx=95,cy=95,C=2*Math.PI*r,sw=50; let off=0,html='';
  segments.forEach(seg=>{
    const frac = Math.max(seg.frac,0), len=frac*C;
    html+=`<circle class="donut-slice" data-tip="${seg.label}: ${(seg.frac*100).toFixed(1)}%" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${sw}" stroke-dasharray="${len.toFixed(1)} ${C.toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 ${cx} ${cy})"/>`;
    if(frac>=0.05){
      const midAngleDeg = ((off+len/2)/C)*360 - 90, rad = midAngleDeg*Math.PI/180;
      const lx = cx + r*Math.cos(rad), ly = cy + r*Math.sin(rad);
      html += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="13" font-weight="600" fill="#fff" text-anchor="middle" dominant-baseline="middle" style="pointer-events:none;">${Math.round(frac*100)}%</text>`;
    }
    off += len;
  });
  svg.innerHTML = html;
}

function months(){ return [...new Set(DATA.calls.map(c=>c.d.slice(0,7)))].sort(); }
function callsInPeriod(){ return PERIOD==='cumulative' ? DATA.calls : DATA.calls.filter(c=>c.d.startsWith(PERIOD)); }
// Calls per calendar day in the selected period, clipped to the dates the data covers.
function perDay(calls){
  const start = PERIOD==='cumulative' ? DATA.date_min : (PERIOD.length===4 ? `${PERIOD}-01-01` : `${PERIOD}-01`);
  let end;
  if(PERIOD==='cumulative') end = DATA.date_max;
  else if(PERIOD.length===4) end = `${PERIOD}-12-31`;
  else { const [y,m] = PERIOD.split('-').map(Number); end = `${PERIOD}-${String(new Date(y, m, 0).getDate()).padStart(2,'0')}`; }
  const s = start < DATA.date_min ? DATA.date_min : start, e = end > DATA.date_max ? DATA.date_max : end;
  const days = Math.max(1, Math.round((new Date(e+'T00:00:00') - new Date(s+'T00:00:00'))/86400000) + 1);
  const byDay = {};
  calls.forEach(c=>{ byDay[c.d] = (byDay[c.d]||0) + 1; });
  const top = Object.entries(byDay).sort((a,b)=>b[1]-a[1])[0];
  return {days, avg: calls.length/days, avgAns: calls.filter(c=>c.a).length/days, max: top ? top[1] : 0, maxDay: top ? top[0] : null};
}
function periodLabel(){ return PERIOD==='cumulative' ? 'cumulative' : (PERIOD.length===4 ? PERIOD : monthLong(PERIOD)); }

function headline(calls){
  const ans = calls.filter(c=>c.a), miss = calls.filter(c=>!c.a);
  const byCaller = {};
  calls.forEach(c=>{ (byCaller[c.c] = byCaller[c.c] || []).push(c); });
  const callers = Object.values(byCaller);
  const withMiss = callers.filter(v=>v.some(c=>!c.a));
  const never = callers.filter(v=>!v.some(c=>c.a));
  const waits = ans.map(c=>c.wait).filter(w=>w!==null);
  const rungCalls = calls.filter(c=>c.rung.length);
  return {
    total: calls.length, ans: ans.length, miss: miss.length, rate: pct(ans.length, calls.length),
    callers: callers.length, withMiss: withMiss.length, never: never.length,
    recovered: withMiss.length - withMiss.filter(v=>!v.some(c=>c.a)).length,
    repeat: callers.filter(v=>v.length>1).length,
    waitMed: median(waits),
    talkAvg: mean(ans.map(c=>c.talk)), talkHrs: ans.reduce((a,c)=>a+c.talk,0)/3600,
    firstRing: pct(rungCalls.filter(c=>c.rung[0][1]).length, rungCalls.length),
    shortTalk: ans.filter(c=>c.talk<10).length,
  };
}


function agentStats(calls){
  const teamAns = calls.filter(c=>c.a).length;
  const by = {};
  const get = n => by[n] = by[n] || {name:n, rung:0, ans:0, rings:[], talk:[], days:new Set(), months:{}, resKnown:0, resYes:0, resPart:0};
  calls.forEach(c=>{
    const seen = new Set();
    c.rung.forEach(([n])=>{ if(!seen.has(n)){ seen.add(n); get(n).rung++; } });
    if(c.a && c.ag){
      const s = get(c.ag); s.ans++; s.talk.push(c.talk); s.days.add(c.d);
      // resolved on the call - only calls whose outcome could be told from listening / the transcript
      // (callbacks and wrong numbers have nothing to resolve, so they are left out)
      // follow-ups/updates and helpline check-ins have nothing to resolve either - left out (reviewer's definition)
      const res = c.lc && /^yes/i.test(c.lc.rc||'') && !/^(Callback only|Wrong number)/.test(c.lc.th||'')
        && c.lc.want !== 'Follow-up on an earlier case' && c.lc.resp !== 'Just asked questions, nothing to resolve' ? c.lc.res : null;
      if(['Yes','Partly','No'].includes(res)){ s.resKnown++; if(res==='Yes') s.resYes++; if(res==='Partly') s.resPart++; }
      if(c.ring!==null) s.rings.push(c.ring);
      if(!seen.has(c.ag)) s.rung++;     // answered without appearing in the ring list
    }
  });
  const rows = Object.values(by).map(s=>({
    name: s.name, rung: s.rung, ans: s.ans, missed: s.rung - s.ans,
    pickup: pct(s.ans, s.rung), ringMed: median(s.rings),
    talkAvg: mean(s.talk), talkHrs: s.talk.reduce((a,b)=>a+b,0)/3600,
    share: pct(s.ans, teamAns), days: s.days.size,
    resKnown: s.resKnown, resYes: s.resYes, resPart: s.resPart, resolved: s.resKnown ? pct(s.resYes, s.resKnown) : null,
    fewCalls: s.rung < DATA.rank_floor,   // still scored and ranked - flagged so readers know the rate is thin
  }));
  // Score = simple average of two rates, both measured on HER OWN calls (so low demand is not penalised):
  //   pickup rate   = calls she answered / calls that rang her
  //   resolved rate = calls fully resolved / her answered calls whose outcome is known (coded calls)
  // 50/50, no other weights (the reviewer's choice, 2026-10-07). An agent with no coded calls is scored
  // on pickup alone and tagged. Speed and talk time are context only.
  // (Tried and dropped: a weighted index with a volume term, which penalised low demand; a within-20s pickup rate.)
  rows.forEach(r=>{ r.pickupOnly = r.resolved===null || r.resolved===undefined;
    r.score = r.pickup===null ? null : (r.pickupOnly ? r.pickup : (r.pickup + r.resolved)/2);
    r.fewCoded = !r.pickupOnly && r.resKnown < DATA.rank_floor; });
  // ties broken by more calls rung (a rate on more calls is the more reliable one)
  rows.sort((a,b)=> (b.score??-1)-(a.score??-1) || b.rung-a.rung).forEach((r,i)=>{ r.rank = i+1; });
  return rows;
}

    <section><div class="section-head"><h2 class="serif">Month by Month</h2><span class="hint">cumulative, not affected by the period picker</span></div>
      <div class="panel"><div id="table-monthly"></div></div></section>`;

  const weeks = {};
  calls.forEach(c=>{
    const d = new Date(c.d+'T00:00:00'); d.setDate(d.getDate() - ((d.getDay()+6)%7));
    const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; // local date - toISOString() shifts IST back a day
    const w = weeks[k] = weeks[k] || {a:0,m:0}; c.a ? w.a++ : w.m++;
  });
  const wk = Object.keys(weeks).sort();
  volumeRateChart('chart-weekly', wk.map(k=>{ const [y,m,d]=k.split('-'); return `${+d} ${MONTH_NAMES[m]}`; }), wk.map(k=>weeks[k].a), wk.map(k=>weeks[k].m));

  const mrows = months().map(m=>{
    const hh = headline(DATA.calls.filter(c=>c.d.slice(0,7)===m));
    return {m, label:monthLong(m), total:hh.total, ans:hh.ans, miss:hh.miss, rate:hh.rate, callers:hh.callers, never:hh.never, talk:hh.talkHrs};
  });
  makeSortableTable('table-monthly', [
    {label:'Month', key:'m'}, {label:'Calls', key:'total', num:true}, {label:'Answered', key:'ans', num:true},
    {label:'Missed', key:'miss', num:true}, {label:'Answer Rate', key:'rate', num:true},
    {label:'Callers', key:'callers', num:true}, {label:'Never Reached', key:'never', num:true}, {label:'Talk Hours', key:'talk', num:true},
  ], mrows, r=>[r.label, fmtNum(r.total), fmtNum(r.ans), fmtNum(r.miss),
    `<span style="color:${grade(r.rate)};font-weight:700">${fmtPct(r.rate)}</span>`, fmtNum(r.callers), fmtNum(r.never), fmtF(r.talk,1)]);
}

// ---------------------------------------------------------------- Agent Performance
function scoreCell(v, r){
  if(v===null||v===undefined) return '—';
  const tip = !r ? '' : r.pickupOnly ? `Pickup ${fmtPct(r.pickup,0)} (no coded calls yet, so pickup only)`
    : `Average of pickup ${fmtPct(r.pickup,0)} (${r.ans}/${r.rung}) and resolved ${fmtPct(r.resolved,0)} (${r.resYes}/${r.resKnown})`;
  return `<div class="score-cell"${tip ? ` data-tip="${tip}"` : ''}><div class="score-bar"><div class="fill" style="width:${v}%;background:${grade(v)}"></div></div><span class="score-num" style="color:${grade(v)}">${fmtF(v,0)}%</span></div>`;
}

  const calls = callsInPeriod(), rows = agentStats(calls), h = headline(calls);
  const el = document.getElementById('panel-agents');

    <section><div class="section-head"><h2 class="serif tip" data-tip="${TIPS['Performance Score']}">Agent Ranking</h2><span class="hint">${periodLabel()} &middot; click a row for her full breakdown</span></div>
      <div class="panel">
        <p class="crumbs" style="margin:0 0 14px;">Score = the average of two rates, each on her own calls: <b>pickup rate</b> (calls she answered, of those that rang her) and <b>resolved rate</b> (calls fully resolved, of her answered calls where the outcome is known). <span class="status-tag na">few calls</span> = a rate on fewer than ${DATA.rank_floor} calls; <span class="status-tag na">pickup only</span> = no coded calls yet.</p>
        <div id="table-agents"></div>
      </div>
    </section>
    <section><div class="section-head"><h2 class="serif">Who Answers the Calls</h2><span class="hint">workload only, not scored &middot; share of the ${fmtNum(h.ans)} answered calls</span></div>
      <div class="panel">${donutHtml('svg-who-answers', whoSegs)}</div></section>
    <section><div class="section-head"><h2 class="serif">Pickup Rate by Month</h2><span class="hint">cumulative, not affected by the period picker &middot; hover a point for calls &middot; click a card for her full breakdown</span></div>
      <div class="panel">
        <div class="legend-row-wrap" style="margin:0 0 12px;">

        <div class="sm-grid" id="agent-months-grid"></div>

  makeSortableTable('table-agents', [
    {label:'Rank', key:'rank', num:true}, {label:'Agent', key:'name'},
    {label:'Score', key:'score', num:true, tip:TIPS['Performance Score']},
    {label:'Pickup Rate', key:'pickup', num:true, tip:TIPS['Pickup Rate']},

    {label:'Avg Talk', key:'talkAvg', num:true, tip:'Average conversation length on the calls she answered. Shown for context, not scored — a longer call is not automatically a better one.'},
    {label:'Resolved Rate', key:'resolved', num:true, tip:'Of her answered calls where the outcome could be told (from listening or the transcript), the share fully resolved during the call. Half of the score. Note: it depends partly on what callers ask - a wallet-recharge problem often needs the CLF or bank, not the didi.'},
  ], rows, r=>[r.rank ?? '—', esc(r.name) + (r.pickupOnly ? ' <span class="status-tag na">pickup only</span>' : ''), scoreCell(r.score, r),
    `<span style="color:${grade(r.pickup)};font-weight:600">${fmtPct(r.pickup,0)}</span>`,
    fmtNum(r.rung) + (r.fewCalls ? ` <span class="status-tag na" data-tip="Rate based on fewer than ${DATA.rank_floor} calls - treat with caution.">few calls</span>` : ''),

    r.resKnown ? `<span data-tip="Fully resolved ${r.resYes}, partly ${r.resPart}, of ${r.resKnown} calls where the outcome was clear"><span style="color:${grade(r.resolved)};font-weight:600">${fmtPct(r.resolved,0)}</span> <span class="soft">(${r.resYes}/${r.resKnown})</span>${r.fewCoded ? ' <span class="status-tag na">few calls</span>' : ''}</span>` : '<span class="soft">—</span>'],
    {enabled:()=>true, handler:r=>openAgentModal(r)});

  drawDonutSegs('svg-who-answers', whoSegs);

  // Pickup rate over time as small multiples - one card per didi, her line + the

  allTime.forEach((r,i)=>{

      {x, y: team, name:'Whole team', type:'scatter', mode:'lines', line:{color:'#B7BEB7', width:2, dash:'dash'},
       hovertemplate:'Team: %{y}%<extra></extra>'},
      {x, y, name:r.name, type:'scatter', mode:'lines+markers+text', line:{color:agentColor(r.name), width:2},
       marker:{size:9, color:agentColor(r.name), line:{color:'#FFFFFF', width:2}},
       text: y.map(v=>v===null?'':`${v}%`), textposition:'top center', textfont:{size:12, color:'#33413A'},
       customdata: pts.map(s=>s && s.rung ? [s.ans, s.rung] : [0,0]),
       hovertemplate:`<b>${esc(r.name)}: %{y}%</b><br>answered %{customdata[0]} of %{customdata[1]} calls<extra></extra>`, connectgaps:false},
    ], {...plotlyBarLayout(''), height:190, margin:{t:14,b:28,l:40,r:14}, showlegend:false, hovermode:'x unified',
        xaxis:{type:'category', automargin:true, showgrid:false},
